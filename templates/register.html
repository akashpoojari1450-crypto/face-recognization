<!DOCTYPE html>
<html>

<head>
    <title>Face Registration</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            margin: 80px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }

        input[type="file"] {
            padding: 5px;
        }

        button {
            background-color: #4CAF50;
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #333;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Register Person</h2>

        <form action="/register" method="POST" enctype="multipart/form-data">

            <input
                type="text"
                name="name"
                placeholder="Enter Name"
                required
            >

            <input
                type="number"
                name="age"
                placeholder="Enter Age"
                min="0"
                max="99"
                required
            >

            <input
                type="text"
                name="job"
                placeholder="Enter Job"
                required
            >

            <input
                type="text"
                name="phone"
                placeholder="Enter Phone Number"
                required
            >

            <input
                type="text"
                name="address"
                placeholder="Enter Address"
                required
            >

            <label>Upload Photos:</label>

            <input
                type="file"
                name="images"
                multiple
                accept="image/*"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <a href="/recognize">
            Go to Recognition Page
        </a>

    </div>

</body>

</html>
